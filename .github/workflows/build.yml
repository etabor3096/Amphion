# Build check for pull requests into dev (Issue #33).
# Runs the React demo's type check + Vite build (the demo lives in demo/ since P0-01). It only builds: no coding agent, no secrets, no deploy.
# Making this a required status check in the `dev-integration` ruleset is Elijah's step, not this file's.
name: Build

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    # The job name `build` is the required status check in the `dev-integration` ruleset. Do not rename it.
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - run: npm ci

      - run: npm run build
