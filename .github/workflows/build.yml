# Build check for pull requests into dev (Issue #33).
# Runs the React demo's type check + Vite build. It only builds: no coding agent, no secrets, no deploy.
# Making this a required status check in the `dev-integration` ruleset is Elijah's step, not this file's.
name: Build

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
